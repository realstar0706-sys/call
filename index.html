<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>전화 걸기</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; background:#f4f5f7; color:#101418; }
  @media (prefers-color-scheme: dark) { body { background:#111418; color:#eef1f4; } }
  main { text-align:center; padding:24px 16px; }
  #n { font-size:30px; font-weight:800; letter-spacing:.5px; margin:0 0 20px; font-variant-numeric:tabular-nums; }
  a { display:inline-block; font-size:22px; font-weight:800; color:#fff; background:#047857; text-decoration:none;
      padding:16px 40px; border-radius:999px; }
  p { color:#5b6470; font-size:14px; margin-top:18px; }
</style>
</head>
<body>
<main>
  <div id="n">번호 없음</div>
  <a id="go" href="#">📞 전화 걸기</a>
  <p>전화 앱이 바로 안 뜨면 위 단추를 누르세요.<br>통화 뒤 이 탭은 닫으셔도 됩니다.</p>
</main>
<script>
  // 번호는 주소의 # 뒤에만 있어 서버로 보내지지 않는다.
  var d = decodeURIComponent((location.hash || "").slice(1)).replace(/[^0-9+]/g, "");
  if (d) {
    var f = d.length === 11 ? d.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3")
          : d.length === 10 ? d.replace(/(\d{2,3})(\d{3,4})(\d{4})/, "$1-$2-$3") : d;
    document.getElementById("n").textContent = f;
    var a = document.getElementById("go"); a.href = "tel:" + d;
    history.replaceState(null, "", location.pathname);   // 주소창·방문기록에서 번호 지우기
    location.href = "tel:" + d;
  }
</script>
</body>
</html>
